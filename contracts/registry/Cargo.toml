[package]
name = "heybe-registry"
description = "Heybe registry: deterministic token-bound account addresses and deployment."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
heybe-account = { path = "../account" }
heybe-test-nft = { path = "../test-nft" }
