name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (test + wasm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip until contracts exist
        if: hashFiles('contracts/Cargo.toml') == ''
        run: echo "No contracts/Cargo.toml yet; nothing to build."

      - name: Install Rust
        if: hashFiles('contracts/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: clippy

      - name: Cache cargo
        if: hashFiles('contracts/Cargo.toml') != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}

      # soroban-sdk 28 only builds contract wasm through `stellar contract build`.
      - name: Install stellar CLI
        if: hashFiles('contracts/Cargo.toml') != ''
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      # The registry tests deploy the real account wasm, so build it first.
      - name: Build wasm
        if: hashFiles('contracts/Cargo.toml') != ''
        working-directory: contracts
        run: stellar contract build

      - name: Test
        if: hashFiles('contracts/Cargo.toml') != ''
        working-directory: contracts
        run: cargo test --locked

      - name: Clippy
        if: hashFiles('contracts/Cargo.toml') != ''
        working-directory: contracts
        run: cargo clippy --all-targets --locked -- -D warnings

  app:
    name: Demo app (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the app exists
        if: hashFiles('app/package.json') == ''
        run: echo "No app/package.json yet; nothing to build."

      - name: Install Node
        if: hashFiles('app/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        if: hashFiles('app/package.json') != ''
        working-directory: app
        run: |
          npm ci
          npm run build
